plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.mazzyy.clearpane'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.mazzyy.clearpane'
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName '1.3'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    lint {
        abortOnError false
    }
}

dependencies {
    // Document-start scripts in every frame, and a safe page-to-app message channel.
    implementation 'androidx.webkit:webkit:1.11.0'
}
