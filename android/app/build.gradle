plugins {
    id 'com.android.application'
}

android {
    namespace 'com.local.webshell'
    compileSdk 34

    defaultConfig {
        applicationId 'com.local.webshell'
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName '1.2'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    lint {
        abortOnError false
    }
}
